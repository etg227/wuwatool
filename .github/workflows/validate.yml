name: Validate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax check
        run: |
          node --check app.js
          node --check baseline-sync.js
          node --check profile-save-v3.js
      - name: Data syntax check
        run: |
          python -m json.tool data/characters.json >/dev/null
          python -m json.tool data/character-mechanics.json >/dev/null
          python -m json.tool data/character-mechanics-extra.json >/dev/null
          python -m json.tool data/sonata-effects.json >/dev/null
