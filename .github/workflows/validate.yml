name: Validate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax check
        run: |
          node --check app.js
          node --check baseline-sync.js
          node --check profile-save-v3.js
          node --check hub.js
          node --check gacha.js
          node --check ocr.js
          node --check ui.js
          node --check worker/gacha-proxy.js
      - name: Data syntax check
        run: |
          python -m json.tool data/characters.json >/dev/null
          python -m json.tool data/character-mechanics.json >/dev/null
          python -m json.tool data/base-stats.json >/dev/null
          python -m json.tool data/character-mechanics-extra.json >/dev/null
          python -m json.tool data/sonata-effects.json >/dev/null
          python -m json.tool data/echoes.json >/dev/null
      - name: Regression tests (scores, panel, sets, storage, OCR)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/regression.cjs
